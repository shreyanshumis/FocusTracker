<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A quick study check · FocusTracker</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <div class="brand"><img src="logo.png" alt="" width="72" height="72"> FOCUSTRACKER</div>
  <p class="eyebrow">A MOMENT BEFORE YOU WATCH</p>
  <h1>Are you sure<br>it’s about studies?</h1>
  <p>You opened YouTube during focus time. Take a breath and choose what you want to do.</p>
  <div class="actions"><button id="yes" disabled>Yes, it’s for studies</button><button id="no" class="quiet">No, back to focus</button></div>
  <p id="status" class="small" role="status">Checking your focus session…</p>
  <p class="small">This is a reminder, not a content filter. It won’t judge whether a video is educational.</p>
</main><script src="gate.js"></script></body></html>
